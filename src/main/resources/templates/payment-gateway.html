```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Payment - Campus Canteen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-container">
    <div class="container my-5">

        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <!-- Error message -->
                <div th:if="${paymentError}"
                     class="alert alert-danger rounded-4">
                    <i class="bi bi-x-circle-fill me-2"></i>
                    <span th:text="${paymentError}"></span>
                </div>

                <div class="card border-0 shadow rounded-4">

                    <div class="card-body p-4">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="display-5 mb-2">💳</div>
                            <h3 class="fw-bold">Online Payment</h3>

                            <p class="text-muted mb-0">
                                Campus Canteen Demo Payment
                            </p>

                            <span class="badge bg-warning text-dark mt-2">
                                DEMO ONLY
                            </span>
                        </div>

                        <!-- Amount -->
                        <div class="text-center bg-light rounded-4 p-3 mb-4">
                            <div class="small text-muted">
                                Amount to Pay
                            </div>

                            <div class="display-6 fw-bold text-primary">
                                ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">
                                    0.00
                                </span>
                            </div>
                        </div>

                        <!-- Payment method -->
                        <ul class="nav nav-pills nav-justified mb-4">

                            <li class="nav-item">
                                <button class="nav-link active"
                                        data-bs-toggle="pill"
                                        data-bs-target="#upi"
                                        type="button">
                                    <i class="bi bi-phone me-1"></i>
                                    UPI
                                </button>
                            </li>

                            <li class="nav-item">
                                <button class="nav-link"
                                        data-bs-toggle="pill"
                                        data-bs-target="#card"
                                        type="button">
                                    <i class="bi bi-credit-card me-1"></i>
                                    Card
                                </button>
                            </li>

                        </ul>

                        <form id="paymentForm"
                              th:action="@{/payment/{token}/process(token=${order.tokenNumber})}"
                              method="post">

                            <div class="tab-content">

                                <!-- UPI -->
                                <div class="tab-pane fade show active" id="upi">

                                    <label class="form-label fw-bold">
                                        Demo UPI ID
                                    </label>

                                    <input type="text"
                                           id="upiInput"
                                           class="form-control form-control-lg"
                                           placeholder="student@upi">

                                    <div class="form-text">
                                        Example: student@upi
                                    </div>

                                </div>

                                <!-- CARD -->
                                <div class="tab-pane fade" id="card">

                                    <label class="form-label fw-bold">
                                        Demo Card Number
                                    </label>

                                    <input type="text"
                                           id="cardInput"
                                           class="form-control form-control-lg"
                                           placeholder="4111 1111 1111 1111">

                                    <div class="row mt-2">

                                        <div class="col-6">
                                            <label class="form-label">
                                                Expiry
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   placeholder="MM/YY">
                                        </div>

                                        <div class="col-6">
                                            <label class="form-label">
                                                CVV
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   placeholder="123">
                                        </div>

                                    </div>

                                </div>

                            </div>

                            <!-- Hidden value sent to Java -->
                            <input type="hidden"
                                   name="upiOrCardInput"
                                   id="paymentValue">

                            <!-- Pay button -->
                            <button type="submit"
                                    id="payButton"
                                    class="btn btn-canteen-primary w-100 py-3 mt-4 rounded-pill fw-bold">

                                <i class="bi bi-lock-fill me-2"></i>
                                Pay ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">
                                    0.00
                                </span>

                            </button>

                            <!-- Processing -->
                            <div id="processing"
                                 class="text-center mt-4 d-none">

                                <div class="spinner-border text-primary mb-3">
                                </div>

                                <h5 class="fw-bold">
                                    Processing Payment...
                                </h5>

                                <p class="text-muted small">
                                    Please wait
                                </p>

                            </div>

                        </form>

                        <!-- Demo information -->
                        <div class="alert alert-info mt-4 rounded-4 small">

                            <i class="bi bi-info-circle-fill me-2"></i>

                            <strong>Demo Payment:</strong>
                            This payment is only for project demonstration.
                            No real money is transferred.

                        </div>

                        <div class="text-center mt-3">

                            <a th:href="@{/cart}"
                               class="text-muted text-decoration-none">

                                <i class="bi bi-arrow-left me-1"></i>
                                Back to Cart

                            </a>

                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script>

document.getElementById("paymentForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const upiTab = document.getElementById("upi");
    const cardTab = document.getElementById("card");

    let value = "";

    // Check which payment method is active
    if (upiTab.classList.contains("active")) {

        value = document.getElementById("upiInput").value.trim();

        if (value === "") {
            alert("Please enter a demo UPI ID.");
            return;
        }

    } else {

        value = document.getElementById("cardInput").value.trim();

        if (value === "") {
            alert("Please enter a demo card number.");
            return;
        }

    }

    // Put value into hidden field
    document.getElementById("paymentValue").value = value;

    // Show processing
    document.getElementById("payButton").classList.add("d-none");
    document.getElementById("processing").classList.remove("d-none");

    // Simulate payment processing
    setTimeout(() => {

        document.getElementById("paymentForm").submit();

    }, 1500);

});

</script>

</body>
</html>
```
