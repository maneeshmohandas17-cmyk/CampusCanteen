<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Campus Canteen</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-container d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <!-- Flash Alerts -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${info}" class="alert alert-info alert-dismissible fade show rounded-4 shadow-sm" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i><span th:text="${info}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                    <div class="p-4 text-center border-bottom bg-light">
                        <div class="rounded-circle bg-primary text-white mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 52px; height: 52px;">
                            <i class="bi bi-person-fill-lock fs-3"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Campus Canteen Portal</h4>
                        <p class="text-muted small mb-0">Sign in with your credentials to preorder or manage orders</p>
                    </div>

                    <div class="p-4">
                        <!-- Navigation Tabs (Student vs Staff) -->
                        <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill" id="loginTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-pill fw-semibold small" id="student-tab" data-bs-toggle="tab" data-bs-target="#student-login" type="button" role="tab">
                                    <i class="bi bi-mortarboard-fill me-1"></i>Student
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-pill fw-semibold small" id="staff-tab" data-bs-toggle="tab" data-bs-target="#staff-login" type="button" role="tab">
                                    <i class="bi bi-fire me-1"></i>Kitchen Staff
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="loginTabContent">
                            <!-- Student Login Form -->
                            <div class="tab-pane fade show active" id="student-login" role="tabpanel">
                                <form th:action="@{/login}" method="post">
                                    <input type="hidden" name="redirect" th:value="${redirect}">

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Roll Number</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-badge text-muted"></i></span>
                                            <input type="text" id="studentRollInput" name="rollNumber" class="form-control border-start-0"
                                                   placeholder="e.g., CS101" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                            <input type="password" id="studentPassInput" name="password" class="form-control border-start-0"
                                                   placeholder="••••••••" required>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-canteen-primary w-100 py-2 fw-bold rounded-pill mb-3">
                                        Sign In as Student
                                    </button>

                                    <!-- Quick Demo Autofill for testing -->
                                    <div class="p-2 bg-light rounded-3 text-center mb-3">
                                        <small class="text-muted d-block mb-1">Testing Demo Credentials:</small>
                                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3"
                                                onclick="fillStudent('CS101', 'password123')">
                                            <i class="bi bi-magic me-1"></i>Fill Demo Student (CS101)
                                        </button>
                                    </div>

                                    <div class="text-center small text-muted">
                                        New student? <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Create an Account</a>
                                    </div>
                                </form>
                            </div>

                            <!-- Kitchen Staff Login Form -->
                            <div class="tab-pane fade" id="staff-login" role="tabpanel">
                                <form th:action="@{/admin/login}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Staff Username</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                                            <input type="text" id="staffUserInput" name="username" class="form-control border-start-0"
                                                   placeholder="admin" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Staff Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-muted"></i></span>
                                            <input type="password" id="staffPassInput" name="password" class="form-control border-start-0"
                                                   placeholder="admin123" required>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold rounded-pill mb-3">
                                        Sign In to Kitchen Board
                                    </button>

                                    <div class="p-3 bg-light rounded-3 text-center mb-3">
                                        <small class="text-muted d-block mb-2 fw-bold text-uppercase" style="letter-spacing: 0.5px;">Canteen Staff Login Options:</small>
                                        <div class="d-grid gap-2">
                                            <div class="d-flex gap-1 justify-content-center flex-wrap" th:if="${canteens != null and !canteens.isEmpty()}">
                                                <button type="button" th:each="c : ${canteens}"
                                                        class="btn btn-outline-primary btn-sm rounded-pill px-2 flex-fill"
                                                        th:data-canteen="${c}"
                                                        onclick="fillStaff(this.getAttribute('data-canteen'), 'admin123')">
                                                    <i class="bi bi-shop me-1"></i><span th:text="${c}">Canteen</span>
                                                </button>
                                            </div>
                                            <div th:if="${canteens == null or canteens.isEmpty()}" class="text-muted small py-1">
                                                <em>No active canteens in system.</em>
                                            </div>
                                            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3"
                                                    onclick="fillStaff('admin', 'admin123')">
                                                <i class="bi bi-shield-lock me-1"></i>Central Admin (All Canteens)
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function fillStudent(roll, pass) {
        document.getElementById('studentRollInput').value = roll;
        document.getElementById('studentPassInput').value = pass;
    }
    function fillStaff(user, pass) {
        document.getElementById('staffUserInput').value = user;
        document.getElementById('staffPassInput').value = pass;
    }
</script>
</body>
</html>
