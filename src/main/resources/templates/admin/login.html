<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Campus Canteen</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <!-- Flash Error -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                <div class="p-4 text-center border-bottom bg-light">
                    <div class="rounded-circle bg-dark text-warning mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 56px; height: 56px;">
                        <i class="bi bi-fire fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-1">Kitchen & Staff Portal</h4>
                    <p class="text-muted small mb-0">Canteen Operations & Live Display</p>
                </div>

                <div class="p-4">
                    <form th:action="@{/admin/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Staff Username</label>
                            <input type="text" id="staffUser" name="username" class="form-control" placeholder="admin" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Staff Password</label>
                            <input type="password" id="staffPass" name="password" class="form-control" placeholder="admin123" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold rounded-pill mb-3">
                            Sign In to Kitchen Board
                        </button>

                        <div class="p-3 bg-light rounded-3 text-center mb-3">
                            <small class="text-muted d-block mb-2 fw-bold text-uppercase" style="letter-spacing: 0.5px;">Canteen Staff Login Options:</small>
                            <div class="d-grid gap-2">
                                <div class="d-flex gap-1 justify-content-center flex-wrap" th:if="${canteens != null and !canteens.isEmpty()}">
                                    <button type="button" th:each="c : ${canteens}"
                                            class="btn btn-outline-primary btn-sm rounded-pill px-2 flex-fill"
                                            th:data-canteen="${c}"
                                            onclick="fillStaffLogin(this.getAttribute('data-canteen'), 'admin123')">
                                        <i class="bi bi-shop me-1"></i><span th:text="${c}">Canteen</span>
                                    </button>
                                </div>
                                <div th:if="${canteens == null or canteens.isEmpty()}" class="text-muted small py-1">
                                    <em>No active canteens in system.</em>
                                </div>
                                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3"
                                        onclick="fillStaffLogin('admin', 'admin123')">
                                    <i class="bi bi-shield-lock me-1"></i>Central Admin (All Canteens)
                                </button>
                            </div>
                        </div>

                        <div class="text-center">
                            <a th:href="@{/}" class="text-secondary small text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i>Back to Student Canteen
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function fillStaffLogin(user, pass) {
        document.getElementById('staffUser').value = user;
        document.getElementById('staffPass').value = pass;
    }
</script>
</body>
</html>
