<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Campus Canteen</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-container d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Alert Messages -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                    <div class="p-4 text-center border-bottom bg-light">
                        <div class="rounded-circle bg-primary text-white mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 52px; height: 52px;">
                            <i class="bi bi-mortarboard-fill fs-3"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Create Student Account</h4>
                        <p class="text-muted small mb-0">Register your college ID to start preordering canteen food</p>
                    </div>

                    <div class="p-4">
                        <form th:action="@{/register}" th:object="${student}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">College Roll Number *</label>
                                    <input type="text" th:field="*{rollNumber}" class="form-control" placeholder="e.g., CS105" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Full Name *</label>
                                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g., John Doe" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">College Email *</label>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="john@campus.edu" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Department</label>
                                    <select th:field="*{department}" class="form-select">
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="Electronics & Comm">Electronics & Comm</option>
                                        <option value="Mechanical Eng">Mechanical Eng</option>
                                        <option value="Civil Engineering">Civil Engineering</option>
                                        <option value="Management Studies">Management Studies</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Mobile Number</label>
                                    <input type="tel" th:field="*{phone}" class="form-control" placeholder="e.g., 9876543210">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Account Password *</label>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="p-3 bg-light rounded-3 my-3 d-flex align-items-center gap-2">
                                <i class="bi bi-wallet2 text-success fs-4"></i>
                                <div class="small">
                                    <strong>Welcome Perk:</strong> New student accounts receive ₹500 test balance in their Campus Canteen Wallet.
                                </div>
                            </div>

                            <button type="submit" class="btn btn-canteen-primary w-100 py-2 fw-bold rounded-pill mb-3">
                                Complete Registration
                            </button>

                            <div class="text-center small text-muted">
                                Already registered? <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none">Sign In</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
