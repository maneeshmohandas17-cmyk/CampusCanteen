<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice - Campus Canteen</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-container d-flex align-items-center py-5">
    <div class="container text-center">
        <div class="display-1 text-warning mb-3">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">Oops! Something Went Wrong</h2>
        <p class="text-muted mb-4 lead" th:text="${errorMessage != null ? errorMessage : 'The requested page or order could not be found.'}"></p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/menu}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-grid me-1"></i>Back to Menu
            </a>
            <a th:href="@{/}" class="btn btn-outline-dark rounded-pill px-4">
                <i class="bi bi-house me-1"></i>Canteen Home
            </a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
