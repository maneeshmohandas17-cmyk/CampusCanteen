spring.application.name=campus-canteen
server.port=8080

# =======================================================
# Database Configuration (Embedded H2 with MySQL compatibility)
# =======================================================
spring.datasource.url=jdbc:h2:file:./data/campus_canteen;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =======================================================
# Thymeleaf & Web Settings
# =======================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8